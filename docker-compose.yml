services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Vite reenvía /api al backend por la red de compose (ver vite.config.ts)
      - API_PROXY_TARGET=http://backend:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Solo accesible desde esta máquina (Swagger en http://localhost:8000/docs).
    # El frontend llega al backend por la red interna de compose, no por este puerto.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
