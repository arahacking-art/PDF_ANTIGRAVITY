server {
    listen 80;
    server_name _;
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ─── Certificados SSL ───────────────────────────────────────────────────────
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protocolos y cifrados modernos (TLS 1.2+ únicamente)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ✅ MEJORA: Cabeceras de seguridad HTTP estándar
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ✅ MEJORA: Compresión Gzip — reduce el tamaño de JS/CSS hasta un 70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ─── 1. Frontend: Servir archivos React compilados ──────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Necesario para el routing de React (SPA)
        try_files $uri $uri/ /index.html;

        # Cache agresiva para assets estáticos (JS, CSS, imágenes)
        location ~* \.(js|mjs|css|png|jpg|jpeg|svg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── 2. Backend: Proxy a FastAPI ────────────────────────────────────────────
    location /api/ {
        # IMPORTANTE: Sin barra final en proxy_pass → Nginx preserva el prefijo /api/
        # Con barra final (http://backend:8000/) se eliminaría /api/ y FastAPI daría 404.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Límite de tamaño para subida de PDFs
        client_max_body_size 100M;

        # Timeouts extendidos para OCR y conversiones pesadas (hasta 5 minutos)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
