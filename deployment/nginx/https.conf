##
## https.conf — Configuración Nginx de producción para CamePDF
## Versión 2.0 — Hardening de seguridad completo
##

# ─── Rate Limiting — Protección DoS en la API ─────────────────────────────────
# Define una zona de memoria compartida de 10MB para rastrear IPs.
# Límite: 10 peticiones por minuto por IP.
# Un PDF pesado tarda segundos en procesarse → 10r/m es más que suficiente para uso legítimo.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ─── Certificados SSL ───────────────────────────────────────────────────────
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protocolos y cifrados modernos (TLS 1.2+ únicamente)
    ssl_protocols TLSv1.2 TLSv1.3;

    # ✅ Cipher suite moderno (Mozilla Intermediate 2024 — solo AEAD, sin CBC vulnerables)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # ✅ Caché de sesiones TLS — evita handshake completo en cada reconexión
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── Cabeceras de Seguridad HTTP ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ✅ Content Security Policy — previene XSS en una app que renderiza PDFs externos
    # - script-src 'wasm-unsafe-eval': necesario para PDF.js (WebAssembly)
    # - worker-src blob: 'self': necesario para los Web Workers de pdf-lib y PDF.js
    # - img-src data: blob:: necesario para miniaturas de páginas renderizadas en canvas
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob: 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # ✅ Bloquear acceso a archivos ocultos (ej. .env, .git, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # ✅ MEJORA: Compresión Gzip — reduce el tamaño de JS/CSS hasta un 70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ─── 1. Frontend: Servir archivos React compilados ──────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Necesario para el routing de React (SPA)
        try_files $uri $uri/ /index.html;

        # Cache agresiva para assets estáticos (JS, CSS, imágenes)
        location ~* \.(js|mjs|css|png|jpg|jpeg|svg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── 2. Backend: Proxy a FastAPI ────────────────────────────────────────────
    location /api/ {
        # ✅ Rate limiting: máx 10 req/min por IP, permite ráfaga de 5 peticiones
        # Responde con 429 Too Many Requests si se supera el límite
        limit_req zone=api_zone burst=5 nodelay;
        limit_req_status 429;

        # IMPORTANTE: Sin barra final en proxy_pass → Nginx preserva el prefijo /api/
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ FIX RENDIMIENTO: Desactivar el buffering del cuerpo de la petición.
        # Sin esto, Nginx descarga el PDF completo a disco antes de enviarlo al backend.
        # Con esto, el stream va directo al backend → subidas hasta 2x más rápidas.
        proxy_request_buffering off;

        # Límite de tamaño para subida de PDFs
        client_max_body_size 100M;

        # Timeouts extendidos para OCR y conversiones pesadas (hasta 5 minutos)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
