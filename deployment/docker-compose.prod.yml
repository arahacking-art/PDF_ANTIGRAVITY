version: '3.8'

services:
  frontend_proxy:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: came_pdf_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # ✅ FIX: Usar nc (netcat) para verificar que el puerto 443 está escuchando.
      # wget fallaba porque rechazaba el certificado SSL autofirmado.
      test: ["CMD-SHELL", "nc -z localhost 443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: came_pdf_backend
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      # ✅ La IP se lee del archivo deployment/.env (ignorado por Git)
      # Crea ese archivo en el servidor: echo "ALLOWED_ORIGIN=https://10.1.0.200" > deployment/.env
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
