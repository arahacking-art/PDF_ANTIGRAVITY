services:
  frontend_proxy:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: came_pdf_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # ✅ [11] Límites de recursos — previene que Nginx monopolice el servidor
    mem_limit: 256m
    cpus: 0.5
    # ✅ Hardening: previene escalada de privilegios dentro del contenedor
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Verificar que el proceso Nginx está corriendo.
      # Más confiable que wget/nc en Alpine con certificados autofirmados.
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: came_pdf_backend
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      # ✅ La IP se lee del archivo deployment/.env (ignorado por Git)
      # Crea ese archivo en el servidor: echo "ALLOWED_ORIGIN=https://10.1.0.200" > deployment/.env
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://localhost}
    restart: unless-stopped
    # ✅ [11] Límites de recursos — previene DoS por conversiones pesadas de PDF.
    # Con 8GB de RAM en el servidor, asignamos 5GB al backend para soportar
    # picos de carga simultánea sin OOMKill:
    #   - 2× LibreOffice (DOCX→PDF): hasta 800MB c/u = 1.6GB
    #   - 2× OCR Tesseract:          hasta 600MB c/u = 1.2GB
    #   - Python baseline + buffers:                  = ~300MB
    #   - Total peak estimado:                        ≈ 3-4GB
    # Dejamos 5GB como límite con margen de seguridad.
    # SO Ubuntu + Nginx = ~2.5GB → total: 5 + 2.5 = 7.5GB de 8GB disponibles.
    mem_limit: 5g
    cpus: 6.0
    # ✅ Hardening: previene escalada de privilegios dentro del contenedor
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
